<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .nav-link:hover {
        color: #0d6efd;
        transition: color 0.3s ease;
      }

      .fade-in {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeInUp 1s ease forwards;
        animation-delay: 2.5s;
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      img:hover {
        transform: scale(1.03);
        transition: transform 0.4s ease;
      }

      .badge-pulse {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      .carousel-img {
        max-height: 450px; /* default for mobile */
        object-fit: cover;
        width: 100%;
      }

      @media (min-width: 768px) {
        /* md breakpoint */
        .carousel-img {
          max-height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav
        class="navbar sticky-top navbar-expand-sm align-items-center bg-white"
      >
        <a class="navbar-brand d-flex align-items-center" href="#">
          <h1 class="m-0">
            <span class="badge text-bg-dark">Chayanit Kitmek</span>
          </h1>
        </a>
        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto text-end">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </nav>
      <div class="row align-items-center">
        <div class="col-12 col-md-6 fade-in ms-auto text-center text-md-center">
          <h1>Chayanit Kitmek</h1>
          <h2 class="badge badge-pulse text-bg-secondary">Junior Developer</h2>
          <p>Dedicated. Never Give Up. Moving forward.</p>
        </div>
        <div class="col-12 col-md-6 fade-in">
          <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  src="./asset/picture-hero.jpg"
                  class="carousel-img img-fluid rounded"
                  alt="Slide 1"
                />
              </div>
              <div class="carousel-item">
                <img
                  src="./asset/picture-hero-2.jpg"
                  class="carousel-img img-fluid rounded"
                  alt="Slide 2"
                />
              </div>
              <div class="carousel-item">
                <img
                  src="./asset/picture-hero-3.jpg"
                  class="carousel-img img-fluid rounded"
                  alt="Slide 3"
                />
              </div>
            </div>
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 col-md-3"></div>
        <div class="col-12 col-md-3"></div>
        <div class="col-12 col-md-3"></div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
